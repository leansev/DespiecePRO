<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Info de placas</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#1a2a4a;font-family:"Segoe UI",Arial,sans-serif;color:#eef3ff;overflow:hidden;}
#app{width:100%;height:100%;background:#1a2a4a;border:1px solid rgba(255,255,255,.14);border-radius:12px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;}
.header{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.title{font-size:19px;font-weight:500;}
.content{padding:12px 16px;flex:1;overflow:auto;}
.placa-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);}
.placa-row:last-child{border-bottom:none;}
.color-box{width:16px;height:16px;border:1px solid rgba(255,255,255,.35);border-radius:3px;flex-shrink:0;box-sizing:border-box;}
.placa-info{min-width:110px;flex-shrink:0;}
.placa-label{font-size:14px;font-weight:500;color:#f1f4fa;}
.placa-count{font-size:12px;color:#c1cada;margin-top:2px;}
.placa-name{flex:1;min-width:0;}
.name-input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:4px;color:#eef3ff;font-size:13px;padding:6px 8px;font-family:"Segoe UI",Arial,sans-serif;}
.name-input:disabled{color:#c1cada;opacity:.85;cursor:default;}
.name-input:focus{outline:none;border-color:rgba(96,165,250,.58);background:rgba(255,255,255,.12);}
.empty-placas{color:#c1cada;font-size:13px;padding:8px 0;}
</style>
</head>
<body>
<div id="app">
    <div class="header"><div class="title">Info de placas</div></div>
    <div class="content" id="rows">
        %FILAS%
    </div>
</div>
<script>
(function(){
    function bindNameInputs(){
        var inputs = document.querySelectorAll('.name-input:not([disabled])');
        var i;
        for(i=0;i<inputs.length;i++){
            (function(input){
                function save(){
                    if(window.sketchup && sketchup.update_color_name){
                        sketchup.update_color_name(input.getAttribute('data-hex'), input.value);
                    }
                }
                input.onchange = save;
                input.onblur = save;
            })(inputs[i]);
        }
    }
    bindNameInputs();
})();
</script>
</body>
</html>
